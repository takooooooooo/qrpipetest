<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code File Receiver (v2)</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 2rem; background-color: #f0f0f0; }
        #video { width: 300px; height: 300px; border: 1px solid #ccc; background-color: #000; }
        .status { margin: 1rem 0; width: 300px; }
        #progressBar { width: 100%; }
        #downloadContainer a { display: block; padding: 10px; background-color: #28a745; color: white; text-align: center; text-decoration: none; border-radius: 5px; margin-top: 1rem; }
    </style>
</head>
<body>
    <h1>QRコード ファイル受信</h1>

    <video id="video" autoplay playsinline></video>
    
    <div class="status">
        <p id="statusText">カメラの準備中...</p>
        <progress id="progressBar" value="0" max="100"></progress>
    </div>

    <div id="downloadContainer"></div>

    <script src="/jsqr/jsQR.js"></script> <!-- Assuming jsQR is served from the server -->
    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('video');
            const statusText = document.getElementById('statusText');
            const progressBar = document.getElementById('progressBar');
            const downloadContainer = document.getElementById('downloadContainer');
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d', { willReadFrequently: true });

            let socket;
            let roomId = null;
            let stream = null;
            let animationFrameId = null;

            // 受信状態
            let receivedChunks = [];
            let receivedIndices = new Set();
            let totalChunks = 0;
            let fileMetadata = {};

            function start() {
                const urlParams = new URLSearchParams(window.location.search);
                roomId = urlParams.get('room');
                if (!roomId) {
                    statusText.textContent = 'エラー: ルームIDが指定されていません。';
                    return;
                }
                setupWebSocket();
                startCamera();
            }

            function setupWebSocket() {
                socket = new WebSocket(WEBSOCKET_URL);

                socket.onopen = () => {
                    console.log('WebSocket connected. Joining room...'); // ステータス表示は変更しない
                    socket.send(JSON.stringify({ type: 'join_room', payload: { roomId } }));
                };

                socket.onmessage = (event) => {
                    // 現状、受信側はメッセージを受信しない
                    console.log('Message from server:', event.data);
                };

                socket.onerror = (error) => {
                    console.error('WebSocket Error:', error);
                    statusText.textContent = 'WebSocket接続に失敗しました。';
                };
            }

            function startCamera() {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                    .then(mediaStream => {
                        stream = mediaStream;
                        video.srcObject = stream;
                        video.onloadedmetadata = () => {
                            video.play();
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            statusText.textContent = 'カメラをQRコードに向けてください。';
                            animationFrameId = requestAnimationFrame(tick);
                        };
                    })
                    .catch(err => {
                        statusText.textContent = `カメラエラー: ${err.message}`;
                    });
            }

            function tick() {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });

                    if (code) {
                        handleQrCode(code.data);
                    }
                }
                if (receivedIndices.size < totalChunks || totalChunks === 0) {
                    animationFrameId = requestAnimationFrame(tick);
                }
            }

            function handleQrCode(data) {
                try {
                    const chunk = JSON.parse(data);

                    // メタデータチャンクの処理
                    if (chunk.type === 'metadata') {
                        if (totalChunks === 0) { // 最初のメタデータのみ受け入れる
                            fileMetadata = chunk.payload;
                            totalChunks = fileMetadata.totalChunks;
                            receivedChunks = new Array(totalChunks);
                            progressBar.max = totalChunks;
                            statusText.textContent = `ファイル受信開始: ${fileMetadata.fileName}`;
                        }
                    } else if (typeof chunk.i === 'number' && chunk.d !== undefined) {
                        // データチャンクの処理
                        if (totalChunks === 0) return; // メタデータを受信するまで無視

                        if (!receivedIndices.has(chunk.i)) {
                            receivedChunks[chunk.i] = chunk.d;
                            receivedIndices.add(chunk.i);
                            progressBar.value = receivedIndices.size;
                            statusText.textContent = `${receivedIndices.size}/${totalChunks} 受信中...`;

                            // フィードバックを送信
                            sendFeedback();

                            if (receivedIndices.size === totalChunks) {
                                completeReception();
                            }
                        }
                    }
                } catch (e) {
                    // JSONパースエラーなどは無視
                }
            }
            
            // スロットリングのためのタイマー
            let feedbackTimer = null;
            function sendFeedback() {
                if (feedbackTimer) return; // タイマーがセットされていたら何もしない
                feedbackTimer = setTimeout(() => {
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        const indices = Array.from(receivedIndices);
                        socket.send(JSON.stringify({ type: 'feedback', payload: { roomId, received_indices: indices } }));
                    }
                    feedbackTimer = null; // タイマーをクリア
                }, 200); // 200msごとにフィードバックを送信
            }

            function completeReception() {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                if (stream) stream.getTracks().forEach(track => track.stop());

                statusText.textContent = '受信完了！ファイルを生成中...';

                // 完了をサーバーに通知
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'complete', payload: { roomId } }));
                }

                // ファイル再構築を非同期で実行
                setTimeout(() => {
                    try {
                        // メタデータチャンクはファイルデータではないので除外
                        const fileChunks = receivedChunks.slice(1);
                        const fullBase64 = fileChunks.join('');
                        
                        const binaryString = atob(fullBase64);
                        const len = binaryString.length;
                        const bytes = new Uint8Array(len);
                        for (let i = 0; i < len; i++) {
                            bytes[i] = binaryString.charCodeAt(i);
                        }

                        const blob = new Blob([bytes], { type: fileMetadata.fileType || 'application/octet-stream' });
                        const url = URL.createObjectURL(blob);

                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileMetadata.fileName || 'downloaded_file';
                        a.textContent = `ファイルをダウンロード (${(fileMetadata.fileSize / 1024).toFixed(2)} KB)`;
                        downloadContainer.innerHTML = '';
                        downloadContainer.appendChild(a);

                        statusText.textContent = 'ダウンロード準備完了！';
                    } catch (e) {
                        statusText.textContent = `ファイル復元エラー: ${e.message}`;
                        console.error(e);
                    }
                }, 50);
            }

            start();
        });
    </script>
</body>
</html>
