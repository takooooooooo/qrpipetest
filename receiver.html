<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code File Receiver (v3)</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 2rem; background-color: #f0f0f0; }
        video { width: 300px; height: 300px; border: 1px solid #ccc; background-color: #000; }
        .status { margin: 1rem 0; width: 300px; }
        #progressBar { width: 100%; }
        #downloadContainer a { display: block; padding: 10px; background-color: #28a745; color: white; text-align: center; text-decoration: none; border-radius: 5px; margin-top: 1rem; }
        #log { margin-top: 1rem; font-size: 0.8em; color: #333; background-color: #eee; padding: 10px; border-radius: 5px; width: 300px; max-height: 150px; overflow-y: auto; text-align: left; }
    </style>
</head>
<body>
    <h1>QRコード ファイル受信</h1>

    <video></video>
    
    <div class="status">
        <p id="statusText">準備中...</p>
        <progress id="progressBar" value="0" max="100"></progress>
    </div>

    <div id="downloadContainer"></div>

    <div id="log"><p>ログ:</p></div>

    <script src="common.js"></script>
        <script type="module">
            import QrScanner from 'https://cdn.jsdelivr.net/npm/qr-scanner@latest/qr-scanner.min.js';

            const videoElement = document.querySelector('video');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const downloadContainer = document.getElementById('downloadContainer');
        const logElement = document.getElementById('log');

        let socket;
        let roomId = null;
        let scanner;

        // 受信状態
        let receivedChunks = [];
        let nextChunkIndex = 0;
        let totalChunks = 0;
        let fileMetadata = {};

        function log(message) {
            console.log(message);
            const p = document.createElement('p');
            p.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logElement.appendChild(p);
            logElement.scrollTop = logElement.scrollHeight;
        }

        async function handleScanSuccess(result) {
            try {
                scanner.stop();
                log(`QR検出: ${result.data.substring(0, 30)}...`);
                const chunk = JSON.parse(result.data);

                // メタデータチャンクの処理
                if (chunk.type === 'metadata' && nextChunkIndex === 0) {
                    fileMetadata = chunk.payload;
                    totalChunks = fileMetadata.totalChunks;
                    receivedChunks = new Array(totalChunks);
                    progressBar.max = totalChunks;
                    log(`メタデータ受信: ${fileMetadata.fileName}`);
                    
                    receivedChunks[0] = chunk; // メタデータも保存
                    progressBar.value = 1;
                    nextChunkIndex = 1;

                } else if (chunk.i === nextChunkIndex) {
                    // データチャンクの処理
                    receivedChunks[chunk.i] = chunk.d;
                    progressBar.value = receivedChunks.filter(c => c).length;
                    log(`チャンク ${chunk.i} 受信`);
                    nextChunkIndex++;
                } else {
                    log(`予期せぬチャンクを受信。期待: ${nextChunkIndex}, 受信: ${chunk.i}`);
                    // 予期せぬチャンクは無視して、同じものを再度リクエスト
                }

                // 完了判定と次のリクエスト
                if (nextChunkIndex >= totalChunks) {
                    completeReception();
                } else {
                    requestChunk(nextChunkIndex);
                    log(`${nextChunkIndex}番目のチャンクをリクエスト`);
                    scanner.start();
                }

            } catch (e) {
                log(`スキャンデータ処理エラー: ${e.message}`);
                // エラーが起きてもスキャンを再開
                setTimeout(() => scanner.start(), 500);
            }
        }

        function requestChunk(index) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'request_chunk', payload: { roomId, index } }));
            }
        }

        function completeReception() {
            scanner.destroy();
            statusText.textContent = '受信完了！ファイルを生成中...';
            log('全チャンク受信完了。ファイル生成中...');

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'complete', payload: { roomId } }));
            }

            setTimeout(() => {
                try {
                    const fileDataChunks = receivedChunks.slice(1); // メタデータチャンクを除外
                    const fullBase64 = fileDataChunks.join('');
                    
                    const binaryString = atob(fullBase64);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }

                    const blob = new Blob([bytes], { type: fileMetadata.fileType || 'application/octet-stream' });
                    const url = URL.createObjectURL(blob);

                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileMetadata.fileName || 'downloaded_file';
                    a.textContent = `ファイルをダウンロード`;
                    downloadContainer.appendChild(a);
                    statusText.textContent = 'ダウンロード準備完了！';
                    log('ファイル復元完了。');
                } catch (e) {
                    statusText.textContent = `ファイル復元エラー: ${e.message}`;
                    log(`ファイル復元エラー: ${e.message}`);
                }
            }, 50);
        }

        function setupWebSocket() {
            socket = new WebSocket(WEBSOCKET_URL);
            socket.onopen = () => {
                log('WebSocket接続成功。ルームに参加します。');
                socket.send(JSON.stringify({ type: 'join_room', payload: { roomId } }));
                // 最初のチャンクをリクエスト
                requestChunk(nextChunkIndex);
                log(`${nextChunkIndex}番目のチャンクをリクエスト`);
                // スキャン開始
                scanner.start();
                statusText.textContent = 'QRコードをスキャンしてください';
            };
            socket.onerror = (error) => log(`WebSocketエラー: ${error.message || '不明なエラー'}`);
        }

        // --- Main --- 
        (async () => {
            const urlParams = new URLSearchParams(window.location.search);
            roomId = urlParams.get('room');
            if (!roomId) {
                statusText.textContent = 'エラー: ルームIDがありません。';
                return;
            }

            if (!await QrScanner.hasCamera()) {
                statusText.textContent = 'エラー: カメラが見つかりません。';
                return;
            }

            scanner = new QrScanner(videoElement, handleScanSuccess, { 
                calculateScanRegion: (video) => ({
                    x: 0, y: 0, width: video.videoWidth, height: video.videoHeight
                })
            });
            QrScanner.WORKER_PATH = 'https://cdn.jsdelivr.net/npm/qr-scanner@latest/qr-scanner-worker.min.js';

            setupWebSocket();
        })();

    </script>
</body>
</html>
