<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code File Transmitter (v3)</title>
<style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 2rem; background-color: #f0f0f0; }
    .container { display: flex; justify-content: center; align-items: center; width: 320px; height: 320px; border: 1px solid #ccc; background-color: #fff; padding: 10px; }
    .container img { max-width: 100%; max-height: 100%; image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; }
    .hidden { display: none; }
</style>
</head>
<body>
    <h1>QRコード ファイル送信</h1>

    <div class="controls">
        <input type="file" id="fileInput">
    </div>

    <div id="inviteContainer" class="container">
        <p>ファイルを選択すると、ここに招待用QRコードが表示されます</p>
    </div>

    <div id="qrcodeContainer" class="container hidden">
        <p>受信者の接続待機中...</p>
    </div>

    <div class="status">
        <p id="statusText">ファイルを選択してください</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator/qrcode.js"></script>
    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const fileInput = document.getElementById('fileInput');
            const inviteContainer = document.getElementById('inviteContainer');
            const qrcodeContainer = document.getElementById('qrcodeContainer');
            const statusText = document.getElementById('statusText');

            let socket;
            let roomId = null;
            let selectedFile = null;
            let chunks = [];

            fileInput.addEventListener('change', (event) => {
                selectedFile = event.target.files[0];
                if (!selectedFile) return;

                statusText.textContent = `ファイル準備完了。サーバーに接続します。`;
                prepareChunksAndConnect();
            });

            function prepareChunksAndConnect() {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const fileBuffer = e.target.result;
                    createChunks(fileBuffer);
                    setupWebSocket();
                };
                reader.readAsArrayBuffer(selectedFile);
            }

            function createChunks(fileBuffer) {
                const base64Data = btoa(String.fromCharCode.apply(null, new Uint8Array(fileBuffer)));
                const totalDataChunks = Math.ceil(base64Data.length / QR_PAYLOAD_SIZE);
                chunks = [];

                const metadata = {
                    type: 'metadata',
                    payload: {
                        fileName: selectedFile.name,
                        fileType: selectedFile.type,
                        fileSize: selectedFile.size,
                        totalChunks: totalDataChunks + 1
                    }
                };
                chunks.push(JSON.stringify(metadata));

                for (let i = 0; i < totalDataChunks; i++) {
                    const part = base64Data.substring(i * QR_PAYLOAD_SIZE, (i + 1) * QR_PAYLOAD_SIZE);
                    chunks.push(JSON.stringify({ d: part }));
                }
                statusText.textContent = `チャンク生成完了 (全${chunks.length}個)。`;
            }

            function setupWebSocket() {
                if (socket) socket.close();
                socket = new WebSocket(WEBSOCKET_URL);

                socket.onopen = () => {
                    statusText.textContent = 'サーバー接続完了。ルームを作成中...';
                    socket.send(JSON.stringify({ type: 'create_room' }));
                };

                socket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    switch (data.type) {
                        case 'room_created':
                            handleRoomCreated(data.payload.roomId);
                            break;
                        case 'receiver_joined':
                            handleReceiverJoined();
                            break;
                        case 'request_chunk':
                            handleChunkRequest(data.payload.index);
                            break;
                        case 'complete':
                            handleTransferComplete();
                            break;
                    }
                };

                socket.onerror = (error) => {
                    statusText.textContent = 'WebSocket接続エラー';
                    console.error('WebSocket Error:', error);
                };
            }

            function handleRoomCreated(newRoomId) {
                roomId = newRoomId;
                
                // 現在のパスからファイル名を除外し、receiver.htmlへのパスを安全に構築する
                const currentPath = window.location.pathname;
                const basePath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
                const inviteUrl = `${window.location.origin}${basePath}receiver.html?room=${newRoomId}`;

                statusText.textContent = '受信者にこのQRコードをスキャンさせてください。';
                
                const qr = qrcode(0, 'M');
                qr.addData(inviteUrl);
                qr.make();
                inviteContainer.innerHTML = qr.createImgTag(6);
            }

            function handleReceiverJoined() {
                statusText.textContent = '受信者が接続しました。リクエスト待機中...';
                inviteContainer.classList.add('hidden');
                qrcodeContainer.classList.remove('hidden');
                qrcodeContainer.innerHTML = '<p>リクエスト待機中...</p>';
            }

            function handleChunkRequest(index) {
                if (index < 0 || index >= chunks.length) {
                    console.error(`無効なチャンクリクエスト: ${index}`);
                    return;
                }
                displayQrCode(index);
            }

            function handleTransferComplete() {
                statusText.textContent = '転送が完了しました！';
                qrcodeContainer.innerHTML = '<p>転送完了</p>';
            }

            function displayQrCode(index) {
                const chunkData = JSON.parse(chunks[index]);
                chunkData.i = index; // 常にインデックスを付与
                chunkData.t = chunks.length;

                const qr = qrcode(QR_CONFIG.typeNumber, QR_CONFIG.errorCorrectionLevel);
                qr.addData(JSON.stringify(chunkData));
                qr.make();
                qrcodeContainer.innerHTML = qr.createImgTag(4, 4);
                statusText.textContent = `チャンク ${index + 1}/${chunks.length} を表示中...`;
            }
        });
    </script>
</body>
</html>
